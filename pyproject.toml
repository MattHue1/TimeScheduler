[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hermes-time-scheduler"
version = "0.1.0"
description = "Import timetables from Hermes Agent and sync them to Google Calendar."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "google-api-python-client>=2.160,<3",
  "google-auth-httplib2>=0.2,<1",
  "google-auth-oauthlib>=1.2,<2",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.7,<3",
  "tzdata>=2025.1; platform_system == 'Windows'",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-cov>=6,<7"]

[project.scripts]
timescheduler = "time_scheduler.main:run"
timescheduler-google-auth = "time_scheduler.google_auth:main"

[tool.hatch.build.targets.wheel]
packages = ["src/time_scheduler"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
